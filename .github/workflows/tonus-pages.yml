# Публикует «Тонус» и «Линию» на GitHub Pages: https://<владелец>.github.io/<репозиторий>/ и …/linia/
# Собранный сайт кладётся в ветку gh-pages, GitHub Pages раздаёт её как сайт.
name: Тонус и Линия — публикация на GitHub Pages

on:
  push:
    branches: [claude/plugin-marketplace-ecc-add-7184im]
    paths: ['tonus/**', 'linia/**', '.github/workflows/tonus-pages.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tonus-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # адрес сайта нужен для готовых профилей iPhone (tonus.mobileconfig, linia/linia.mobileconfig)
      SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            tonus/package-lock.json
            linia/package-lock.json
      - name: Тонус
        working-directory: tonus
        run: npm ci && npm test && SITE_URL="$SITE" npm run build
      - name: Линия
        working-directory: linia
        run: npm ci && npm test && SITE_URL="${SITE}linia/" npm run build
      - name: Выложить сайт в ветку gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp -r linia/dist tonus/dist/linia
          cd tonus/dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Тонус и Линия: публикация ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
