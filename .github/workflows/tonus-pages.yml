# Публикует «Тонус» на GitHub Pages: https://<владелец>.github.io/<репозиторий>/
# Собранный сайт кладётся в ветку gh-pages, GitHub Pages раздаёт её как сайт.
name: Тонус — публикация на GitHub Pages

on:
  push:
    branches: [claude/plugin-marketplace-ecc-add-7184im]
    paths: ['tonus/**', '.github/workflows/tonus-pages.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tonus-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tonus
    env:
      # адрес сайта нужен для готового профиля iPhone (tonus.mobileconfig)
      SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tonus/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Выложить сайт в ветку gh-pages
        working-directory: tonus/dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Тонус: публикация ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
